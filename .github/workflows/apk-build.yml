
name: Build APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Extract new project
        run: unzip -q ameer-screens-android-auto-ui-update.zip -d extracted

      - name: Enable AndroidX
        working-directory: extracted/car-screens-main
        run: |
          if grep -q '^android.useAndroidX=' gradle.properties 2>/dev/null; then
            sed -i 's/^android.useAndroidX=.*/android.useAndroidX=true/' gradle.properties
          else
            echo 'android.useAndroidX=true' >> gradle.properties
          fi
          if grep -q '^android.enableJetifier=' gradle.properties 2>/dev/null; then
            sed -i 's/^android.enableJetifier=.*/android.enableJetifier=true/' gradle.properties
          else
            echo 'android.enableJetifier=true' >> gradle.properties
          fi

      - name: Fix Car App Service
        working-directory: extracted/car-screens-main
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p = Path("app/src/main/java/com/carscreens/app/MapsCarAppService.java")
          s = p.read_text()

          if "createHostValidator(" not in s:
              package_end = s.find("\n")
              s = s[:package_end+1] + "\nimport androidx.car.app.validation.HostValidator;\n" + s[package_end+1:]
              pos = s.rfind("}")
              if pos < 0:
                  raise SystemExit("Class closing brace not found")
              method = """
              @Override
              public HostValidator createHostValidator() {
                  return HostValidator.ALLOW_ALL_HOSTS_VALIDATOR;
              }
          """
              s = s[:pos] + method + "\n" + s[pos:]
              p.write_text(s)
          PY

      - name: Build APK
        working-directory: extracted/car-screens-main
        run: gradle :app:assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Ameer-Screens-APK
          path: extracted/car-screens-main/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
