            if(m.startsWith('video')&&A.playVideo){box.textContent='جار تشغيل الفيديو على شاشة السيارة...';A.playVideo(u);return}
            const t=m.startsWith('audio')?'audio':'img';
            const e=document.createElement(t);e.src=FU(u);
            if(t==='img')e.style.cssText='width:100%;border-radius:14px';
            else{e.controls=true;e.autoplay=true;e.preload='auto';e.addEventListener('error',()=>{box.textContent='تعذّر تشغيل الملف الصوتي.'})}
            box.appendChild(e);if(t==='audio')e.play().catch(()=>{});
          }
          """ + html[b:]

          # Improve M3U parsing and HLS/native playback fallback with visible errors.
          a = html.find("function playUrl(u,id){")
          b = html.find("\nfunction addList", a)
          if a < 0 or b < 0:
              raise SystemExit("IPTV function bounds missing")
          html = html[:a] + """function playUrl(u,id){
            const v=$(id);u=(u||'').trim();if(!u)return;
