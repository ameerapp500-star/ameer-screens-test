          function parseM3u(t,base){
            const out=[];let name='',logo='',group='';
            (t||'').replace(/^\\uFEFF/,'').split(/\\r?\\n/).forEach(line=>{
              const l=line.trim();if(!l)return;
              if(l.startsWith('#EXTINF')){
                const comma=l.lastIndexOf(',');name=comma>=0?l.slice(comma+1).trim():'';
                const nm=l.match(/tvg-name=[\\"']([^\\"']+)/i);if(!name&&nm)name=nm[1];
                const lg=l.match(/tvg-logo=[\\"']([^\\"']+)/i);logo=lg?lg[1]:'';
                const gp=l.match(/group-title=[\\"']([^\\"']+)/i);group=gp?gp[1]:'';
              }else if(!l.startsWith('#')){
                let u=l;try{if(base)u=new URL(l,base).href}catch(e){}
                out.push({n:name||l,u,logo,group});name='';logo='';group='';
              }
            });return out;
          }
          """ + html[b:]
          html = html.replace(
            "async function addUrl(){try{const u=$('m3url').value.trim();const t=A.fetchText?A.fetchText(u):await(await fetch(u)).text();addList(parseM3u(t));$('m3url').value=''}catch(e){alert('تعذّر تحميل القائمة. تحقق من الرابط أو الصق محتواها.')}}",
            "async function addUrl(){try{const u=$('m3url').value.trim();if(!u)throw 0;const t=A.fetchText?A.fetchText(u):await(await fetch(u)).text();if(!t||!t.trim())throw 0;const l=parseM3u(t,u);if(!l.length)throw 0;addList(l);$('m3url').value=''}catch(e){alert('تعذّر تحميل القنوات من الرابط. جرّب رابط M3U مباشر أو اختر الملف من الجهاز.')}}"
          )
          html = html.replace("function show(id,t){$('home').style.display='none';", "function show(id,t){if(A.hidePlayer)A.hidePlayer();$('home').style.display='none';")
          html = html.replace("function home(){$('app').style.display='none';", "function home(){if(A.hidePlayer)A.hidePlayer();$('app').style.display='none';")
          html = html.replace("function carBack(){if($('app').style.display==='none')return;", "function carBack(){if(A.hidePlayer)A.hidePlayer();if($('app').style.display==='none')return;")
          html_path.write_text(html)

          # Harden touch-to-WebView coordinate mapping and enable WebView focus for input fields.
          java_path = Path("app/src/main/java/com/carscreens/app/CarWebScreen.java")
          java = java_path.read_text()
          java = java.replace(
              "web = new WebView(getCarContext());",
              "web = new WebView(getCarContext());\n                web.setFocusable(true);\n                web.setFocusableInTouchMode(true);"
          )
          java = java.replace(
              "import android.view.Surface;",
              "import android.view.Surface;" + chr(10) + "import android.view.View;" + chr(10) + "import android.widget.FrameLayout;" + chr(10) + "import androidx.media3.common.MediaItem;" + chr(10) + "import androidx.media3.exoplayer.ExoPlayer;" + chr(10) + "import androidx.media3.ui.PlayerView;"
          )
          java = java.replace(
              "private WebView web;",
              "private WebView web;" + chr(10) + "private FrameLayout root;" + chr(10) + "private PlayerView playerView;" + chr(10) + "private ExoPlayer carPlayer;"
          )
          java = java.replace(
              "web.setFocusableInTouchMode(true);",
              "web.setFocusableInTouchMode(true);" + chr(10) + "root = new FrameLayout(getCarContext());" + chr(10) + "playerView = new PlayerView(getCarContext());" + chr(10) + "playerView.setUseController(true);" + chr(10) + "playerView.setVisibility(View.GONE);"
          )
          java = java.replace(
              "presentation.setContentView(web);",
              "root.addView(web, new FrameLayout.LayoutParams(-1, -1));" + chr(10) + "root.addView(playerView, new FrameLayout.LayoutParams(-1, -1));" + chr(10) + "presentation.setContentView(root);"
          )
          java = java.replace(
              "web = null;",
              "web = null;" + chr(10) + "try { if (carPlayer != null) { carPlayer.release(); carPlayer = null; } } catch (Exception ignored) {}" + chr(10) + "playerView = null; root = null;",
              1
          )
          old_play = """@JavascriptInterface public void playVideo(String url) {
              try { Intent i = new Intent(context, VideoActivity.class); i.putExtra("u", url); i.addFlags(Intent.FLAG_ACTIVITY_NEW_TASK); context.startActivity(i); } catch (Exception ignored) {}
            }"""
          new_play = """@JavascriptInterface public void playVideo(String url) {
              main.post(() -> {
                try {
                  if (carPlayer == null) carPlayer = new ExoPlayer.Builder(context).build();
                  playerView.setPlayer(carPlayer);
                  web.setVisibility(View.GONE);
                  playerView.setVisibility(View.VISIBLE);
                  carPlayer.setMediaItem(MediaItem.fromUri(Uri.parse(url)));
                  carPlayer.prepare();
                  carPlayer.play();
                } catch (Exception e) { Log.e("AmeerCarWeb", "In-car playback failed", e); }
              });
            }
            @JavascriptInterface public void hidePlayer() {
              main.post(() -> {
                try { if (carPlayer != null) carPlayer.pause(); } catch (Exception ignored) {}
                if (playerView != null) playerView.setVisibility(View.GONE);
                if (web != null) web.setVisibility(View.VISIBLE);
              });
            }"""
          if old_play not in java:
              raise SystemExit("native player bridge anchor missing")
          java = java.replace(old_play, new_play, 1)

          java = java.replace(
              "presentation.show();\n                web.loadUrl",
              "presentation.show();\n                web.requestFocus();\n                web.loadUrl"
          )
          java = java.replace(
              "long now = android.os.SystemClock.uptimeMillis();",
              """float sx = current == null ? x : x * web.getWidth() / Math.max(1f, current.getWidth());
              float sy = current == null ? y : y * web.getHeight() / Math.max(1f, current.getHeight());
              long now = android.os.SystemClock.uptimeMillis();"""
          )
          java = java.replace("MotionEvent.ACTION_DOWN, x, y, 0", "MotionEvent.ACTION_DOWN, sx, sy, 0")
          java = java.replace("MotionEvent.ACTION_UP, x, y, 0", "MotionEvent.ACTION_UP, sx, sy, 0")
          java = java.replace(
              "float y = Math.max(2, web.getHeight() * .5f);",
              "float y = Math.max(2, web.getHeight() * .5f);\n              float sdx = current == null ? dx : dx * web.getWidth() / Math.max(1f, current.getWidth());\n              float sdy = current == null ? dy : dy * web.getHeight() / Math.max(1f, current.getHeight());"
          )
          java = java.replace("MotionEvent.ACTION_MOVE, x - dx, y - dy, 0", "MotionEvent.ACTION_MOVE, sx - sdx, sy - sdy, 0")
          java = java.replace("MotionEvent.ACTION_UP, x - dx, y - dy, 0", "MotionEvent.ACTION_UP, sx - sdx, sy - sdy, 0")
          java = java.replace("web.dispatchTouchEvent(down);", "presentation.getWindow().getDecorView().dispatchTouchEvent(down);")
          java = java.replace("web.dispatchTouchEvent(up);", "presentation.getWindow().getDecorView().dispatchTouchEvent(up);")
          if "presentation.getWindow().getDecorView().dispatchTouchEvent(down);" not in java:
              raise SystemExit("touch dispatch patch failed")
          # Keep media playback in WebView by serving persisted SAF/MediaStore URIs through the app bridge URL.
          java = java.replace(
              "import android.webkit.WebViewClient;",
              "import android.webkit.WebViewClient;" + chr(10) + "import android.webkit.WebResourceRequest;" + chr(10) + "import android.webkit.WebResourceResponse;" + chr(10) + "import android.content.res.AssetFileDescriptor;" + chr(10) + "import java.io.InputStream;"
          )
          marker = "@Override public void onPageFinished(WebView view, String url) {"
          replacement = """@Override public WebResourceResponse shouldInterceptRequest(WebView view, WebResourceRequest request) {
                    String address = request.getUrl().toString();
                    if (!address.startsWith("https://localfile.invalid/")) return null;
                    Map<String,String> headers = new HashMap<>();
                    headers.put("Access-Control-Allow-Origin", "*");
                    headers.put("Accept-Ranges", "bytes");
                    AssetFileDescriptor afd = null;
                    try {
                      String raw = Uri.parse(address).getQueryParameter("u");
                      if (raw == null) throw new IllegalArgumentException("Missing media URI");
                      Uri source = Uri.parse(raw);
                      String mime = getCarContext().getContentResolver().getType(source);
                      if (mime == null) mime = "application/octet-stream";
                      afd = getCarContext().getContentResolver().openAssetFileDescriptor(source, "r");
                      if (afd == null) throw new IllegalStateException("Cannot open media descriptor");
                      long total = afd.getLength();
                      String range = request.getRequestHeaders().get("Range");
                      if (range != null && total > 0) {
                        java.util.regex.Matcher matcher = java.util.regex.Pattern.compile("bytes=(\\\\d+)-(\\\\d*)").matcher(range);
                        if (matcher.matches()) {
                          long start = Long.parseLong(matcher.group(1));
                          long end = matcher.group(2).isEmpty() ? total - 1 : Math.min(total - 1, Long.parseLong(matcher.group(2)));
                          if (start >= total || end < start) {
                            headers.put("Content-Range", "bytes */" + total);
                            afd.close();
                            return new WebResourceResponse(mime, null, 416, "Range Not Satisfiable", headers, new java.io.ByteArrayInputStream(new byte[0]));
                          }
                          long remaining = end - start + 1;
                          InputStream stream = afd.createInputStream();
                          long skipped = 0; while (skipped < start) { long n = stream.skip(start - skipped); if (n <= 0) break; skipped += n; }
                          final AssetFileDescriptor owned = afd;
                          InputStream bounded = new java.io.FilterInputStream(stream) {
                            long left = remaining;
                            @Override public int read() throws java.io.IOException { if (left <= 0) return -1; int v = super.read(); if (v >= 0) left--; return v; }
                            @Override public int read(byte[] b, int off, int len) throws java.io.IOException { if (left <= 0) return -1; int n = super.read(b, off, (int)Math.min(len, left)); if (n > 0) left -= n; return n; }
                            @Override public void close() throws java.io.IOException { try { super.close(); } finally { owned.close(); } }
                          };
                          headers.put("Content-Range", "bytes " + start + "-" + end + "/" + total);
                          headers.put("Content-Length", String.valueOf(remaining));
                          return new WebResourceResponse(mime, null, 206, "Partial Content", headers, bounded);
                        }
                      }
                      InputStream stream = afd.createInputStream();
                      final AssetFileDescriptor owned = afd;
                      InputStream managed = new java.io.FilterInputStream(stream) {
                        @Override public void close() throws java.io.IOException { try { super.close(); } finally { owned.close(); } }
                      };
                      if (total > 0) headers.put("Content-Length", String.valueOf(total));
                      return new WebResourceResponse(mime, null, 200, "OK", headers, managed);
                    } catch (Exception e) {
                      try { if (afd != null) afd.close(); } catch (Exception ignored) {}
                      try {
                        String raw = Uri.parse(address).getQueryParameter("u");
                        InputStream fallback = getCarContext().getContentResolver().openInputStream(Uri.parse(raw));
                        return new WebResourceResponse("application/octet-stream", null, 200, "OK", headers, fallback);
                      } catch (Exception ignored) {
                        return new WebResourceResponse("text/plain","utf-8",404,"Not Found",headers,new java.io.ByteArrayInputStream(new byte[0]));
                      }
                    }
                  }
                  @Override public void onPageFinished(WebView view, String url) {"""
          if marker not in java:
              raise SystemExit("WebViewClient insertion anchor missing")
          java = java.replace(marker, replacement, 1)
          # Native M3U retrieval runs off the WebView UI thread (JavascriptInterface thread).
          bridge_marker = "@JavascriptInterface public void openApp(String pkg) {"
          bridge_add = """@JavascriptInterface public String fetchText(String address) {
              java.net.HttpURLConnection connection = null;
              try {
                java.net.URL u = new java.net.URL(address);
                connection = (java.net.HttpURLConnection) u.openConnection();
                connection.setConnectTimeout(12000); connection.setReadTimeout(20000);
                connection.setRequestProperty("User-Agent", "AmeerScreens/1.0");
                java.io.InputStream in = connection.getInputStream();
                java.io.ByteArrayOutputStream out = new java.io.ByteArrayOutputStream();
                byte[] buffer = new byte[8192]; int count; int total = 0;
                while ((count = in.read(buffer)) != -1 && total < 5000000) { out.write(buffer,0,count); total += count; }
                in.close();
                return new String(out.toByteArray(), java.nio.charset.StandardCharsets.UTF_8);
              } catch (Exception e) { return ""; }
              finally { if (connection != null) connection.disconnect(); }
            }
            """
          if bridge_marker not in java:
              raise SystemExit("CarBridge insertion anchor missing")
          java = java.replace(bridge_marker, bridge_add + bridge_marker, 1)
          java_path.write_text(java)
          PY

      - name: Validate original interface JavaScript
        working-directory: extracted/car-screens-main
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          html = Path("app/src/main/assets/index.html").read_text()
          scripts = re.findall(r"<script[^>]*>(.*?)</script>", html, re.S)
          if not scripts:
              raise SystemExit("No JavaScript found in index.html")
          Path("/tmp/ameer-index-check.js").write_text("\n".join(scripts))
          PY
          node --check /tmp/ameer-index-check.js

      - name: Build APK
        working-directory: extracted/car-screens-main
        run: gradle :app:assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Ameer-Screens-APK
          path: extracted/car-screens-main/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
