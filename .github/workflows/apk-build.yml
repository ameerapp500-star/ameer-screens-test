
name: Build APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Extract new project
        run: unzip -q ameer-screens-android-auto-ui-update.zip -d extracted

      - name: Upload extracted source for inspection
        uses: actions/upload-artifact@v4
        with:
          name: ameer-screens-test-source
          path: extracted/car-screens-main/
          if-no-files-found: error

      - name: Enable AndroidX
        working-directory: extracted/car-screens-main
        run: |
          if grep -q '^android.useAndroidX=' gradle.properties 2>/dev/null; then
            sed -i 's/^android.useAndroidX=.*/android.useAndroidX=true/' gradle.properties
          else
            echo 'android.useAndroidX=true' >> gradle.properties
          fi
          if grep -q '^android.enableJetifier=' gradle.properties 2>/dev/null; then
            sed -i 's/^android.enableJetifier=.*/android.enableJetifier=true/' gradle.properties
          else
            echo 'android.enableJetifier=true' >> gradle.properties
          fi

      - name: Register media service and secure car host validation
        working-directory: extracted/car-screens-main
        run: |
          python3 - <<'PY'
          from pathlib import Path

          service = Path("app/src/main/java/com/carscreens/app/MapsCarAppService.java")
          source = service.read_text()
          if "createHostValidator(" not in source:
              source = source.replace(
                  "import androidx.car.app.CarAppService;",
                  "import androidx.car.app.CarAppService;\nimport androidx.car.app.validation.HostValidator;"
              )
              marker = "  @Override public Session onCreateSession()"
              method = """  @Override
            public HostValidator createHostValidator() {
              return new HostValidator.Builder(this)
                  .addAllowedHosts(androidx.car.app.R.array.hosts_allowlist_sample)
                  .build();
            }

          """
              if marker not in source:
                  raise SystemExit("Car app service insertion point not found")
              source = source.replace(marker, method + marker, 1)
              service.write_text(source)

          manifest = Path("app/src/main/AndroidManifest.xml")
          xml = manifest.read_text()
          if 'android:name=".AutoService"' not in xml:
              block = """    <service
                  android:name=".AutoService"
                  android:exported="true"
                  android:permission="android.permission.BIND_MEDIA_BROWSER">
                  <intent-filter>
                      <action android:name="android.media.browse.MediaBrowserService" />
                  </intent-filter>
              </service>
          """
              xml = xml.replace("</application>", block + "  </application>")
              manifest.write_text(xml)
          PY

      - name: Build APK
        working-directory: extracted/car-screens-main
        run: gradle :app:assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Ameer-Screens-APK
          path: extracted/car-screens-main/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
