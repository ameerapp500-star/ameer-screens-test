<style>

</div>

<script>

const $=id=>document.getElementById(id);

const S=(k,v)=>{try{if(v===undefined)return JSON.parse(localStorage.getItem(k));localStorage.setItem(k,JSON.stringify(v))}catch(e){return null}};

const A=window.Android||{openWeb:u=>window.open(u),openApp(){},listApps:()=>'[]',pickFolder(){},folders:()=>'[]',removeFolder(){},listDir:()=>'[]',listMedia:()=>'[]',view(){},playVideo(){},copy(){},deviceId:()=>'TEST'};
const LINKS={news:[['الجزيرة','https://www.aljazeera.net'],['BBC عربي','https://www.bbc.com/arabic'],['سكاي نيوز عربية','https://www.skynewsarabia.com']],

const PAL=[['#1e4fa0','#0a1d45'],['#2c6e83','#1b3550'],['#4a2a7a','#1b1035'],['#2e7d5b','#12352d'],['#7a2a3a','#2a1020']];

async function activate(){
  const c=$('code').value.replace(/\D/g,'');
  if(c.length!==20){$('err').textContent='الكود لازم يكون ٢٠ رقم';return}
  let ok=false;try{ok=await valid(c)}catch(e){}
  if(ok){S('act',c);$('lock').style.display='none';init()}else $('err').textContent='كود غير صحيح'
}
function init(){
  $('grid').innerHTML='';
  const tileOrder=['movies','tv','web','yt','radio','photos','video','files','news','music','kids','apps','mirror','set'];
  TILES.slice().sort((a,b)=>tileOrder.indexOf(a[0])-tileOrder.indexOf(b[0])).forEach(t=>{const d=document.createElement('div');d.className='tile';d.innerHTML=t[3]+t[1];d.onclick=()=>openT(t);$('grid').appendChild(d)});
  $('sw').innerHTML='';PAL.forEach(p=>{const b=document.createElement('b');b.style.background=`linear-gradient(135deg,${p[0]},${p[1]})`;b.onclick=()=>{const c=S('cfg')||{};c.pal=p;S('cfg',c);applyCfg(c)};$('sw').appendChild(b)});

  if(c.pal){document.documentElement.style.setProperty('--g1',c.pal[0]);document.documentElement.style.setProperty('--g2',c.pal[1])}

async function saveSet(){
  const c=S('cfg')||{};c.ico=$('ico').value||c.ico;c.nm=$('nm').value||c.nm;
  const ct=$('city').value.trim();
  if(ct&&ct!==c.city){try{const r=await(await fetch('https://geocoding-api.open-meteo.com/v1/search?count=1&language=ar&name='+encodeURIComponent(ct))).json();if(r.results&&r.results[0]){c.city=ct;c.lat=r.results[0].latitude;c.lon=r.results[0].longitude}else alert('المدينة غير موجودة')}catch(e){alert('تعذّر البحث عن المدينة')}}
  S('cfg',c);applyCfg(c);weather();home()
}
async function weather(){
  const c=S('cfg')||{};const lat=c.lat||31.99,lon=c.lon||44.92,name=c.city||'الديوانية';
  try{const r=await(await fetch(`https://api.open-meteo.com/v1/forecast?latitude=${lat}&longitude=${lon}&current=temperature_2m`)).json();$('wx').textContent='☀️ '+Math.round(r.current.temperature_2m)+'°C  '+name}catch(e){$('wx').textContent=name}
}
function tick(){$('clock').textContent=new Date().toLocaleTimeString('ar-IQ',{hour:'numeric',minute:'2-digit'})}
function show(id,t){$('home').style.display='none';$('app').style.display='block';document.querySelectorAll('.scr').forEach(s=>s.classList.remove('on'));$(id).classList.add('on');$('st').textContent=t||''}
function home(){$('app').style.display='none';$('home').style.display='block';document.querySelectorAll('video,audio').forEach(m=>m.pause());$('mv').innerHTML='';$('fv').innerHTML=''}
function it(box,txt,fn,extra){const d=document.createElement('div');d.className='item';const s=document.createElement('span');s.textContent=txt;s.style.flex=1;s.onclick=fn;d.appendChild(s);if(extra)d.appendChild(extra);box.appendChild(d);return d}
function xb(fn){const x=document.createElement('span');x.textContent='✖';x.onclick=fn;return x}
function openT(t){
  const k=t[0];cur=k;
  // YouTube opens as a normal website in the Android Auto car WebView,
  // not as a separate YouTube phone app or phone-side controller.
  if(k==='yt'){A.openWeb('https://m.youtube.com');return}
  if(k==='kids'){A.openWeb('https://www.youtubekids.com');return}
  if(['web','tv','set'].includes(k)){show(k,t[1]);if(k==='tv')renderTV();return}
  if(k==='radio'){show('radio',t[1]);radioCountries();return}
  if(k==='files'){show('files',t[1]);fshow();return}
  if(k==='maps'||k==='apps'){appKey=k;show('apps',t[1]);$('mapsweb').style.display=k==='maps'?'block':'none';renderApps();return}
  if(LINKS[k]){show('links',t[1]);$('ll').innerHTML='';LINKS[k].forEach(l=>it($('ll'),l[0],()=>{k==='news'?A.openWeb(l[1]):location.href=l[1]}));return}
  show('media',t[1]);loadMedia()
}
function ytGo(){
  let u=$('ytu').value.trim();const m=u.match(/(?:v=|youtu\.be\/|embed\/|shorts\/)([\w-]{11})/)||(u.length===11?[0,u]:null);
  if(!m){alert('رابط غير صحيح');return}
  A.openWeb('https://m.youtube.com/watch?v='+m[1])
}
function webGo(){const u=$('wu').value.trim();if(!u)return;A.openWeb(/^https?:/.test(u)?u:/^[^ ]+\.[^ ]+$/.test(u)?'https://'+u:'https://www.google.com/search?q='+encodeURIComponent(u))}
function addBm(){const u=$('wu').value.trim();if(!u)return;S('bm',(S('bm')||[]).concat(/^https?:/.test(u)?u:'https://'+u));renderBm()}
function renderBm(){const a=S('bm')||[];$('bm').innerHTML='';a.forEach((u,i)=>it($('bm'),u,()=>A.openWeb(u),xb(()=>{a.splice(i,1);S('bm',a);renderBm()})))}
// TV
function playUrl(u,id){const v=$(id);u=u.trim();if(!u)return;if(window.Hls&&Hls.isSupported()&&/\.m3u8/.test(u)){const h=new Hls();h.loadSource(u);h.attachMedia(v)}else v.src=u;v.play().catch(()=>{})}
function parseM3u(t){const out=[];let n='';t.split(/\r?\n/).forEach(l=>{l=l.trim();if(l.startsWith('#EXTINF'))n=l.split(',').pop();else if(l&&!l.startsWith('#')){out.push({n:n||l,u:l});n=''}});return out}
function addList(l){if(!l.length){alert('ما لقيت قنوات');return}S('ch',(S('ch')||[]).concat(l));renderTV()}
function addM3u(){addList(parseM3u($('m3u').value));$('m3u').value=''}
async function addUrl(){try{const t=await(await fetch($('m3url').value.trim())).text();addList(parseM3u(t));$('m3url').value=''}catch(e){alert('تعذّر تحميل الرابط. الصق محتوى القائمة بدلاً منه.')}}
$('m3f').onchange=async e=>{const f=e.target.files[0];if(f)addList(parseM3u(await f.text()))};
function renderTV(){
  const all=S('ch')||[],fav=S('fv')||[];
  $('tvLive').innerHTML='📡 البث المباشر<small>'+all.length+' قناة</small>';
  $('tvFav').innerHTML='⭐ المفضلة<small>'+fav.length+'</small>';
  const box=$('chs');box.innerHTML='';
  all.forEach((x,i)=>{
    if(tvMode==='fav'&&!fav.includes(x.u))return;
    const st=document.createElement('span');st.textContent=fav.includes(x.u)?'⭐':'☆';
    st.onclick=()=>{const f=S('fv')||[];const k=f.indexOf(x.u);k>=0?f.splice(k,1):f.push(x.u);S('fv',f);renderTV()};
    const d=it(box,x.n,()=>playUrl(x.u,'tvp'),st);d.appendChild(xb(()=>{all.splice(i,1);S('ch',all);renderTV()}))
  })
}
// Radio (radio-browser.info)
const RB=['https://de1.api.radio-browser.info','https://at1.api.radio-browser.info','https://nl1.api.radio-browser.info'];
async function rb(p){for(const h of RB){try{const r=await fetch(h+'/json/'+p);if(r.ok)return await r.json()}catch(e){}}throw 0}
let RC=[];
async function radioCountries(){
  $('rl').innerHTML='';$('rc').style.display='grid';$('rs').style.display='block';$('rc').innerHTML='<p>جار التحميل...</p>';
  try{RC=(await rb('countries?hidebroken=true')).filter(x=>x.stationcount>0).sort((a,b)=>b.stationcount-a.stationcount);radioFilter()}
  catch(e){$('rc').innerHTML='<p>تعذّر التحميل، تأكد من الإنترنت.</p>'}
}
function cname(c){try{return new Intl.DisplayNames(['ar'],{type:'region'}).of(c.iso_3166_1)}catch(e){return c.name}}
function radioFilter(){
  const q=$('rs').value.trim().toLowerCase();$('rc').innerHTML='';
  RC.filter(c=>!q||cname(c).toLowerCase().includes(q)||c.name.toLowerCase().includes(q)).slice(0,60).forEach(c=>{
    const d=document.createElement('div');d.className='tile';d.style.height='92px';
    const fl=String.fromCodePoint(...[...c.iso_3166_1].map(ch=>127397+ch.charCodeAt(0)));
    d.innerHTML='<span style="font-size:30px">'+fl+'</span>';const s=document.createElement('span');s.textContent=cname(c);d.appendChild(s);
    const n=document.createElement('small');n.textContent=c.stationcount;d.appendChild(n);
    d.onclick=()=>radioStations(c.iso_3166_1);$('rc').appendChild(d)})
}
async function radioStations(code){
  $('rc').style.display='none';$('rs').style.display='none';$('rl').innerHTML='<p>جار التحميل...</p>';
  try{const l=await rb('stations/search?countrycode='+code+'&hidebroken=true&order=votes&reverse=true&limit=200');
    $('rl').innerHTML='';const b=document.createElement('button');b.className='btn';b.textContent='⬆ اختيار دولة ثانية';b.onclick=radioCountries;$('rl').appendChild(b);
    l.forEach(s=>it($('rl'),s.name.trim()||s.url_resolved,()=>{const a=$('rp');a.src=s.url_resolved||s.url;a.play().catch(()=>{})}))}
  catch(e){$('rl').innerHTML='<p>تعذّر تحميل المحطات.</p>'}
}
// Media from device
function player(box,u,m){if(m.startsWith('video')){A.playVideo(u);return}box.innerHTML='';const t=m.startsWith('video')?'video':m.startsWith('audio')?'audio':'img';const e=document.createElement(t);e.src=FU(u);if(t==='img')e.style.cssText='width:100%;border-radius:14px';else{e.controls=true;e.autoplay=true;e.setAttribute('playsinline','')}box.appendChild(e)}
function loadMedia(){
  const kind=cur==='music'?'audio':cur==='photos'?'images':'video';
  const r=A.listMedia(kind);$('ml').innerHTML='';$('mp').innerHTML='';
  if(r==='PERM'){$('ml').innerHTML='<p>اسمح بالصلاحية من النافذة اللي طلعت...</p>';return}
  const a=JSON.parse(r);if(!a.length){$('ml').innerHTML='<p>ما لقيت ملفات.</p>';return}
  const m=kind==='audio'?'audio/':kind==='video'?'video/':'image/';
  a.forEach(x=>{
    if(kind==='images'){const im=document.createElement('img');im.loading='lazy';im.src=FU(x.u);im.onclick=()=>player($('mv'),x.u,m);$('mp').appendChild(im)}
    else it($('ml'),x.n,()=>player($('mv'),x.u,m))
  })
}
function mediaReload(){if($('media').classList.contains('on'))loadMedia()}
// Files (multiple saved folders)
let FP=[];
function fshow(){FP=[];renderFiles()}
function renderFiles(){
  const box=$('fl');box.innerHTML='';
  if(!FP.length){
    JSON.parse(A.folders()).forEach(f=>it(box,'📁 '+f.n,()=>{FP.push([f.t,'']);renderFiles()},xb(()=>{A.removeFolder(f.t);renderFiles()})));
    if(!box.children.length)box.innerHTML='<p>ما أضفت أي مجلد. اضغط إضافة مجلد.</p>';return}
  const [t,d]=FP[FP.length-1];
  it(box,'⬆ رجوع',()=>{FP.pop();renderFiles()});
  const l=JSON.parse(A.listDir(t,d)).sort((a,b)=>(b.d-a.d)||a.n.localeCompare(b.n));
  l.forEach(x=>{
    if(x.d)it(box,'📁 '+x.n,()=>{FP.push([t,x.id]);renderFiles()});
    else it(box,x.n,()=>{const m=x.m||'';if(/^(image|video|audio)\//.test(m))player($('fv'),x.u,m);else A.view(x.u,m)})
  })
}
// Launch other apps (maps / my apps)
function renderApps(){
  const a=S('ap_'+appKey)||[];$('al').innerHTML='';
  if(appKey==='maps' && A.saveMapApps) A.saveMapApps(JSON.stringify(a));
  a.forEach((x,i)=>it($('al'),x.n,()=>A.openApp(x.p),xb(()=>{a.splice(i,1);S('ap_'+appKey,a);if(appKey==='maps' && A.saveMapApps)A.saveMapApps(JSON.stringify(a));renderApps()})));
  $('ap2').innerHTML=''
}
function pickApp(){
  const l=JSON.parse(A.listApps()).sort((a,b)=>a.n.localeCompare(b.n));const box=$('ap2');box.innerHTML='<p>اختر التطبيق:</p>';
  l.forEach(x=>it(box,x.n,()=>{const a=S('ap_'+appKey)||[];if(!a.some(y=>y.p===x.p))a.push(x);S('ap_'+appKey,a);if(appKey==='maps' && A.saveMapApps)A.saveMapApps(JSON.stringify(a));renderApps()}))
}
(async()=>{$('did').textContent=DID.replace(/(.{4})/g,'$1 ').trim();const a=S('act');if(a&&await valid(String(a))){$('lock').style.display='none';init()}})();
</script></body></html>
